# XcodeGen spec — run `xcodegen generate`, then open AMSPacking.xcodeproj.
# One target for the iPhone and the Mac, like AMS Coffee.
name: AMSPacking
options:
  bundleIdPrefix: com.schabbauer
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: D24ENP83QQ
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.69"
    CURRENT_PROJECT_VERSION: "2"
packages:
  # The model — everything the app knows about packing, with no screen in it.
  PackingCore:
    path: Core
targets:
  AMSPacking:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: PackingCore
        product: PackingCore
      - package: PackingCore
        product: PackingLibrary
    entitlements:
      path: App/Config/AMSPacking.entitlements
      properties:
        # The Mac app is sandboxed (TestFlight and the App Store demand it).
        # "user-selected" is what lets a Save window and an Open window hand
        # the app a backup file anywhere he chooses.
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        # The trip's page in his Obsidian vault (0.70): the folder he picks once is
        # remembered as a security-scoped bookmark, which the sandbox allows only with this.
        com.apple.security.files.bookmarks.app-scope: true
        # To buy → Apple Reminders (0.50): the Mac's sandbox keeps the app out of
        # Reminders without it.
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPacking
        # A plain build keeps the library on this device only. iCloud is switched on
        # by building with PACKING_USES_ICLOUD=YES and the iCloud entitlements file
        # (tools/build.sh … icloud, and the TestFlight workflow): an ad-hoc signed
        # Mac app carrying iCloud entitlements is refused at launch, and GitHub's
        # runners have no provisioning profile.
        PACKING_USES_ICLOUD: "NO"
        # Apple Health (0.70, chapter 07 part 7) is the iPhone's alone: an iPhone build
        # signs with AMSPacking-iOS.entitlements (the same keys + HealthKit), the Mac keeps
        # the generated file above, without it. (A build that ships: the TestFlight
        # workflow adds HealthKit to the iPhone's entitlements and checks the archive.)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Config/AMSPacking-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": App/Config/AMSPacking-iOS.entitlements
        # iPhone only on iOS — portrait by design, like the web app on the
        # phone. The Mac app is a separate destination and unaffected.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: App/Config/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    info:
      path: App/Config/Info.plist
      properties:
        CFBundleDisplayName: Packing
        CFBundleName: AMS Packing
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        LSApplicationCategoryType: public.app-category.travel
        ITSAppUsesNonExemptEncryption: false
        # What the device says when the buy list first goes to Reminders (0.50).
        NSRemindersFullAccessUsageDescription: Your To buy list goes into Reminders, to take to the shop; what you tick there is ticked here.
        NSRemindersUsageDescription: Your To buy list goes into Reminders, to take to the shop; what you tick there is ticked here.
        # A place's printed square code (0.69): the iPhone's Camera reads
        # amspacking://place/<name> and offers to open the app on that place.
        CFBundleURLTypes:
          - CFBundleURLName: com.schabbauer.AMSPacking.place
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes: [amspacking]
        # A photo of a packed bag (0.52).
        NSCameraUsageDescription: A photo of a packed bag, kept with the trip, to repack from on the way home.
        # Apple Health fills in the trip review (0.70) — his words, chapter 07 part 7. Read
        # only; Apple wants the second text all the same once an app uses HealthKit.
        NSHealthShareUsageDescription: AMS Packing reads your workouts during a trip to suggest what you used. It never writes to Apple Health.
        NSHealthUpdateUsageDescription: AMS Packing never writes to Apple Health. Apple requires this text all the same.
        # Pack by voice (0.71, a test — spec 07 part 10): the iPhone listens for five words.
        NSMicrophoneUsageDescription: Pack by voice listens for packed, skip, later, where and stop while you pack. What you say stays on this iPhone.
        NSSpeechRecognitionUsageDescription: Pack by voice understands your five words on this iPhone itself, without the internet. Nothing you say leaves it.
        # YES only in builds that carry the iCloud entitlements (see settings below).
        PackingUsesICloud: $(PACKING_USES_ICLOUD)
        # A change on the other device arrives as a silent push (iPhone).
        UIBackgroundModes: [remote-notification]
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
  AMSPackingUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: UITests
    dependencies:
      - target: AMSPacking
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.schabbauer.AMSPackingUITests
        TEST_TARGET_NAME: AMSPacking
schemes:
  AMSPacking:
    build:
      targets:
        AMSPacking: all
    test:
      targets:
        - AMSPackingUITests
        # The model's own tests live in the Core package and run with the app's —
        # BOTH bundles, on the iPhone and on the Mac (until 0.6x the library's ran
        # only in the "core" job's `swift test`; the spec pass, 5 Oct 2026).
        - package: PackingCore/PackingCoreTests
        - package: PackingCore/PackingLibraryTests
