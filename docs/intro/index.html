<title>Packing Tour</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Packing Tour: chapter rail on the left, coach card + a pretend iPhone on the right. Same engine as the other AMS tours.
   Based on AMS Packing 0.126 (build 151). Update this tour in the release that changes a taught screen. */
:root {
  --bg: #F8F4F1; --panel: #FFFFFF; --fg: #2A1D17; --muted: #75635A; --line: #E8DDD6;
  --accent: #B8401A; --accent-soft: #F8E6DE; --good: #2F7D32; --good-soft: #E6F3E6; --warn: #A8431A;
  --shadow: 0 18px 40px rgba(42,29,23,.2);
  --c-home:#2F6FE0; --c-trips:#2F9E63; --c-tpl:#7C5CD6; --c-care:#DD7324; --c-inv:#0F8B8D; --c-todo:#DC3D43; --c-set:#64748B;
  --pbg:#F2F2F7; --pcard:#FFFFFF; --pink:#1C1C1E; --pmuted:#6C6C70; --pline:#E0E0E5; --pglass:rgba(255,255,255,.88); --pfield:rgba(120,120,128,.14);
  --f-display: "Avenir Next", "Helvetica Neue", system-ui, sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  --f-phone: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg:#1A1412; --panel:#251D1A; --fg:#F5ECE7; --muted:#B5A49B; --line:#3B2F2A;
  --accent:#F58F6B; --accent-soft:#3A241B; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-home:#6C9BF2; --c-trips:#52C08A; --c-tpl:#A58BF0; --c-care:#F09A5A; --c-inv:#3FBFC1; --c-todo:#F0787D; --c-set:#94A3B8;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.88); --pfield:rgba(120,120,128,.3);
  color-scheme: dark } }
:root[data-theme="dark"] {
  --bg:#1A1412; --panel:#251D1A; --fg:#F5ECE7; --muted:#B5A49B; --line:#3B2F2A;
  --accent:#F58F6B; --accent-soft:#3A241B; --good:#8FD18F; --good-soft:#1D3320; --warn:#F2A47F;
  --shadow: 0 18px 40px rgba(0,0,0,.55);
  --c-home:#6C9BF2; --c-trips:#52C08A; --c-tpl:#A58BF0; --c-care:#F09A5A; --c-inv:#3FBFC1; --c-todo:#F0787D; --c-set:#94A3B8;
  --pbg:#0E0E10; --pcard:#1C1C1F; --pink:#F2F2F7; --pmuted:#9A9AA0; --pline:#333338; --pglass:rgba(40,40,44,.88); --pfield:rgba(120,120,128,.3);
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; margin: 0 }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 230px minmax(0,1fr); gap: 22px; }
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }
svg.g { fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; flex: none }

/* Rail */
.rail { display: flex; flex-direction: column; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); align-self: start; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.brand h1 { font-family: var(--f-display); font-size: 19px; line-height: 1.1; margin: 0; text-wrap: balance }
.brand small { color: var(--muted); font-size: 12px }
.logo { width: 40px; height: 40px; border-radius: 10px; background: var(--c-home); color: #fff; display: grid; place-items: center; flex: none }
.chap { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; border: 0; background: none; color: var(--fg); font: inherit; text-align: left; cursor: pointer; }
.chap:hover { background: var(--accent-soft) }
.chap:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.chap .n { color: var(--muted); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap }
.chap.cur { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.chap.done .n { color: var(--good) }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: 10px 2px 2px }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .4s }
.railnote { color: var(--muted); font-size: 12px; margin: 4px 2px }

/* Coach */
.main { display: grid; grid-template-columns: minmax(0,1fr); gap: 14px; min-width: 0; align-content: start }
.topnote { margin: 0; padding: 8px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 13.5px }
.coach { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 8px 16px; align-items: center; }
.coach .eyebrow { grid-column: 1 / -1; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); font-weight: 600; display: flex; gap: 8px; align-items: center }
.coach .eyebrow .kind { color: var(--muted); font-weight: 500 }
.coach h2 { font-family: var(--f-display); font-size: 23px; line-height: 1.2; margin: 0; text-wrap: balance }
.coach p { margin: 4px 0 0; color: var(--fg); max-width: 62ch }
.coach .btns { display: flex; gap: 8px; align-items: center }
.btn { font: inherit; font-weight: 600; border-radius: 9px; padding: 8px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer }
.btn.main-b { background: #C44A21; border-color: #C44A21; color: #fff }
.btn.main-b:disabled { opacity: .45; cursor: default }
.btn.ghost { border-color: transparent; color: var(--muted) }
.answers { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px }
.ans { font: inherit; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; text-align: left }
.ans:hover { border-color: var(--accent) }
.ans.right { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 600 }
.ans.wrong { border-color: var(--warn); color: var(--warn); text-decoration: line-through }
.feedback { grid-column: 1 / -1; font-weight: 600; color: var(--good); min-height: 1.4em; margin: 0 }
.feedback.no { color: var(--warn) }

/* Stage = pretend iPhone, 390 x 760, scaled to fit */
.stagebox { position: relative; width: min(100%, 390px); aspect-ratio: 390 / 760; border-radius: 40px; overflow: hidden; box-shadow: 0 0 0 6px #1f1f23, var(--shadow); justify-self: center; background: var(--pbg) }
.stage { position: absolute; left: 0; top: 0; width: 390px; height: 760px; transform-origin: 0 0; font-family: var(--f-phone); font-size: 15px; line-height: 1.3; color: var(--pink); background: var(--pbg); overflow: hidden; -webkit-user-select: none; user-select: none }
.stage button { font: inherit; color: inherit }
.stage input { font: inherit; color: var(--pink); -webkit-user-select: text; user-select: text }
.sbar { position: absolute; left: 0; right: 0; top: 0; height: 44px; display: flex; align-items: flex-end; justify-content: space-between; padding: 0 30px 6px 34px; font-weight: 600; font-size: 15px; z-index: 40; pointer-events: none; background: linear-gradient(var(--pbg) 70%, transparent) }
.sbar .bat { width: 25px; height: 12px; border: 1.5px solid var(--pink); border-radius: 4px; position: relative; opacity: .8 }
.sbar .bat::after { content: ""; position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 70%; background: var(--pink); border-radius: 2px }
.scr { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; padding: 46px 16px 96px; scrollbar-width: none }
.scr::-webkit-scrollbar { display: none }
.scr.nobar { padding-bottom: 150px }
.hd { display: flex; align-items: center; gap: 8px; min-height: 44px }
.hd h1 { margin: 0; font-size: 31px; line-height: 1.1; font-weight: 700; flex: 1; min-width: 0 }
.sub { color: var(--pmuted); font-size: 13px }
.nut { border: 0; background: none; color: var(--c-set); padding: 6px; border-radius: 10px; cursor: pointer; display: grid; place-items: center }
.nut svg { width: 26px; height: 26px }
.search { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: var(--pfield); color: var(--pmuted); border-radius: 10px; padding: 0 10px; min-height: 40px; cursor: pointer; text-align: left; margin: 2px 0 8px }
.search svg { width: 18px; height: 18px }
.sec { margin: 12px 0 4px; font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px }
.card { background: var(--pcard); border-radius: 12px; border: 1px solid var(--pline) }
.row { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 0 12px; border: 0; background: none; text-align: left; cursor: pointer }
.row + .row, .card > .row + * { border-top: 1px solid var(--pline) }
.row .sp, .sp { flex: 1 }
.cd { display: flex; align-items: center; gap: 12px; width: 100%; border: 1.2px solid var(--c-trips); background: var(--pcard); border-radius: 12px; padding: 12px 14px; cursor: pointer; text-align: left }
.cd .big { font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; text-align: center; min-width: 44px }
.cd small { display: block; color: var(--pmuted); font-size: 11.5px; text-align: center }
.cd b { display: block; font-size: 16px }
.frame { background: var(--pcard); border-radius: 14px; border: 1px solid var(--pline); padding: 10px 12px 12px; margin-top: 12px }
.frame .fh { display: flex; align-items: center; margin-bottom: 8px }
.frame .fh b { font-size: 17px; color: var(--c-home); flex: 1 }
.linkb { border: 0; background: none; color: var(--c-home); font-weight: 600; font-size: 13px; cursor: pointer; padding: 6px 0 }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px }
.tile { border: 0; background: var(--pbg); border-radius: 12px; padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; font-size: 12px; font-weight: 600; position: relative }
.tile svg { width: 28px; height: 28px }
.tile .sunb { position: absolute; right: 6px; top: 5px; width: 11px; height: 11px }
.dot { width: 10px; height: 10px; border-radius: 50%; background: #2FA35A; display: inline-block; flex: none }
.bubble { position: absolute; right: 16px; background: var(--pink); color: var(--pbg); border-radius: 9px; padding: 6px 10px; font-size: 12.5px; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,.3) }
.mainb { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 48px; border: 0; color: #fff; font-weight: 600; font-size: 16px; cursor: pointer }
.mainb svg { width: 18px; height: 18px; stroke-width: 2.3 }
.quiet { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; min-height: 36px; border: 0; background: none; color: var(--pmuted); font-weight: 600; cursor: pointer; margin-top: 6px }
.nudge { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; border: 0; background: var(--pcard); border-radius: 10px; padding: 0 12px; margin: 4px 0; cursor: pointer; text-align: left; color: var(--pmuted) }
.nudge b { color: var(--c-trips); font-size: 14px; margin-left: auto; white-space: nowrap }

/* Tab bar */
.tabs { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 58px; border-radius: 29px; background: var(--pglass); backdrop-filter: blur(14px); box-shadow: 0 6px 24px rgba(0,0,0,.18); display: flex; align-items: center; justify-content: space-around; z-index: 30; padding: 0 6px; border: 1px solid var(--pline) }
.tabs button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 9.5px; font-weight: 600; color: var(--pmuted); cursor: pointer; padding: 3px 4px; border-radius: 14px; min-width: 50px; position: relative }
.tabs button svg { width: 22px; height: 22px }
.tabs button.on { background: rgba(120,120,128,.16) }
.tabs .badge { position: absolute; right: 6px; top: 0; background: var(--c-todo); color: #fff; border-radius: 8px; font-size: 9px; padding: 0 4px; min-width: 15px; text-align: center }

/* Pages and sheets */
.dim { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 50 }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 34px; border-radius: 22px 22px 0 0; background: var(--pbg); z-index: 55; overflow: hidden; box-shadow: 0 -8px 30px rgba(0,0,0,.3) }
.sheet .scr { padding-top: 12px; padding-bottom: 40px }
.top { display: flex; align-items: center; gap: 8px; min-height: 44px }
.top .t { flex: 1; text-align: center; font-weight: 700; font-size: 17px }
.hb { border: 0; background: none; font-weight: 600; font-size: 16px; cursor: pointer; padding: 6px 4px; border-radius: 8px }
.hb.fill { color: #fff; padding: 6px 14px; border-radius: 16px }
.hb.out { border: 1.4px solid; padding: 4px 12px; border-radius: 16px }
.back { display: flex; align-items: center; gap: 0; font-size: 16px }
.back svg { width: 20px; height: 20px }
.big { font-size: 31px; font-weight: 700; line-height: 1.1; margin: 2px 0 2px; overflow-wrap: anywhere }
.field { width: 100%; min-height: 44px; border-radius: 10px; border: 1px solid var(--pline); background: var(--pcard); padding: 0 12px; font-size: 17px }
.field.bad { border: 2px solid var(--c-todo) }
.seg { display: flex; padding: 2px; border: 1.2px solid var(--c-home); border-radius: 18px; max-width: 280px }
.seg button { flex: 1; border: 0; background: none; border-radius: 16px; min-height: 28px; font-weight: 600; font-size: 14px; color: var(--c-home); cursor: pointer }
.seg button.on { background: var(--c-home); color: #fff }
.note { color: var(--pmuted); font-size: 12.5px; margin: 4px 0 }
.hd2 { font-weight: 700; font-size: 15px; margin: 12px 0 5px }
.pills { display: flex; flex-wrap: wrap; gap: 6px }
.pill { display: inline-flex; align-items: center; gap: 5px; border: 1.3px solid var(--c-tpl); color: var(--c-tpl); background: none; border-radius: 16px; min-height: 30px; padding: 0 12px; font-size: 14px; font-weight: 500; cursor: pointer }
.pill svg { width: 16px; height: 16px }
.pill.on { background: var(--c-tpl); color: #fff; font-weight: 600 }
.pill.home { border-color: var(--c-home); color: var(--c-home) }
.pill.home.on { background: var(--c-home); color: #fff }
.cal { margin: 6px 0 }
.cal .mt { text-align: center; font-weight: 600; margin-bottom: 4px }
.cal .g { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px }
.cal .wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--pmuted) }
.cal button { border: 0; background: none; height: 32px; font-size: 14px; cursor: pointer; border-radius: 16px; position: relative }
.cal button.band { background: rgba(47,111,224,.18); border-radius: 0 }
.cal button.end { background: var(--c-home); color: #fff }
.cal button.e1 { border-radius: 16px 0 0 16px } .cal button.e2 { border-radius: 0 16px 16px 0 }
.cal button.end.solo { border-radius: 16px }
.calsum { display: flex; align-items: baseline; gap: 10px; min-height: 30px; font-weight: 600; font-size: 14px }
.need { color: var(--c-todo); font-weight: 600; font-size: 14px; text-align: center; margin-bottom: 8px }
.foot { position: absolute; left: 0; right: 0; bottom: 0; background: var(--pbg); border-top: 1px solid var(--pline); padding: 10px 16px 14px; z-index: 5 }
.sw { position: relative; width: 44px; height: 26px; border-radius: 13px; border: 0; background: rgba(120,120,128,.4); cursor: pointer; flex: none }
.sw::after { content: ""; position: absolute; left: 2px; top: 2px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s }
.sw.on { background: var(--c-trips) } .sw.on::after { left: 20px }

/* Grab */
.cnt { font-weight: 600; margin: 4px 0 6px; font-variant-numeric: tabular-nums }
.gl { display: flex; align-items: center; min-height: 44px; gap: 10px; border-bottom: 1px solid var(--pline); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; padding: 0 2px }
.gl + .gl { border-top: 1px solid var(--pline) }
.gl.skip .nm { text-decoration: line-through; color: var(--pmuted) }
.tk { width: 22px; height: 22px; border-radius: 50%; border: 1.8px solid var(--pmuted); display: inline-grid; place-items: center; flex: none; color: #fff }
.tk svg { width: 14px; height: 14px; stroke-width: 2.6 }
.tk.on { background: var(--c-trips); border-color: var(--c-trips) }
.tk.round { width: 28px; height: 28px; border-color: var(--c-trips); color: var(--c-trips); cursor: pointer; background: none; padding: 0 }
.tk.round svg { width: 16px; height: 16px }
.tk.round.on { color: #fff; background: var(--c-trips) }
.skipb { border: 0; background: none; color: var(--pmuted); padding: 6px; cursor: pointer; display: grid }
.skipb svg { width: 18px; height: 18px }
.overlay { position: absolute; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0,0,0,.45); padding: 24px }
.overlay .box { background: var(--pcard); border-radius: 18px; padding: 18px; text-align: center; width: 100%; max-width: 300px }
.overlay .ex { width: 44px; height: 44px; border-radius: 50%; background: var(--c-todo); color: #fff; font-weight: 700; font-size: 26px; display: grid; place-items: center; margin: 0 auto 8px }
.overlay h4 { margin: 0 0 4px; font-size: 20px }
.help { color: var(--pmuted); font-size: 12.5px; margin-top: 10px }

/* Trip */
.status { display: flex; align-items: center; gap: 8px; margin: 2px 0 8px }
.status .st { flex: 1; font-size: 13px; color: var(--pmuted); font-variant-numeric: tabular-nums }
.status .st.all { color: var(--c-trips); font-weight: 600 }
.cup { border: 0; background: none; color: var(--c-trips); padding: 2px; display: grid; cursor: pointer }
.cup svg { width: 22px; height: 22px }
.loop { display: flex; border-radius: 16px; background: rgba(120,120,128,.16); padding: 2px; margin-bottom: 8px }
.loop button { flex: 1; border: 0; background: none; font-size: 12.5px; font-weight: 600; border-radius: 14px; min-height: 28px; color: var(--pmuted); cursor: pointer; white-space: nowrap }
.loop button.dn { color: var(--c-trips) }
.loop button.on { background: var(--c-trips); color: #fff }
.stn { display: flex; align-items: center; gap: 5px; margin-bottom: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px 1px }
.stn::-webkit-scrollbar { display: none }
.stn small { font-weight: 600; font-size: 12px; margin-right: 2px }
.chip { flex: none; border: 1.2px solid var(--c-trips); background: var(--pcard); color: var(--c-trips); border-radius: 11px; height: 22px; padding: 0 9px; font-size: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 4px }
.chip.done { background: var(--c-trips); color: #fff }
.chip.here { background: rgba(47,158,99,.16); border-width: 2px }
.chip.cant { border-style: dashed; border-color: var(--pline); color: var(--pmuted) }
.gr { border-radius: 12px; background: var(--pcard); border: 1px solid var(--pline); margin-bottom: 8px; overflow: hidden }
.gr .row { min-height: 42px }
.gr > .row:not(:first-child), .gr > div + div, .gr > .row + div { border-top: 1px solid var(--pline) }
.gr .bp { padding: 0 12px 10px }
.door { display: flex; align-items: center; width: 100%; border: 1.2px solid var(--c-trips); background: var(--pcard); border-radius: 12px; padding: 0 14px; min-height: 58px; cursor: pointer; text-align: left; margin-bottom: 8px }
.door b { display: block; font-size: 16px }
.door small { color: var(--pmuted); font-size: 12px; font-variant-numeric: tabular-nums }
.segb { display: flex; align-items: center; gap: 8px; margin: 6px 0 4px }
.segb .s2 { display: flex; padding: 2px; border: 1.2px solid var(--c-trips); border-radius: 18px; flex: 1; max-width: 300px }
.segb .s2 button { flex: 1; border: 0; background: none; color: var(--c-trips); font-weight: 600; font-size: 13px; border-radius: 16px; min-height: 26px; cursor: pointer; white-space: nowrap }
.segb .s2 button.on { background: var(--c-trips); color: #fff }
.gh { display: flex; align-items: center; gap: 6px; margin: 12px 0 4px; min-height: 30px }
.gh .fold { border: 0; background: none; display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 15px; cursor: pointer; padding: 0 }
.gh .fold svg { width: 16px; height: 16px; transition: transform .15s }
.gh .fold.open svg { transform: rotate(90deg) }
.gh .ct { color: var(--pmuted); font-size: 13px; font-variant-numeric: tabular-nums }
.gh.dn .fold { color: var(--c-trips) }
.ln { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; border: 0; background: none; text-align: left; cursor: pointer; padding: 0 12px; border-top: 1px solid var(--pline) }
.lines { background: var(--pcard); border-radius: 12px; border: 1px solid var(--pline); overflow: hidden }
.lines .ln:first-child { border-top: 0 }
.ln .nm { flex: 1; min-width: 0; overflow-wrap: anywhere }
.ln.dn .nm { color: var(--pmuted) }
.ln.as .nm { color: var(--pmuted); text-decoration: line-through }
.ln small { color: var(--pmuted); font-size: 12px; white-space: nowrap }
.ln .bt { color: var(--c-trips); font-size: 12px; font-weight: 600 }
.ln .tm { color: var(--c-tpl); width: 15px; height: 15px }
.no { width: 20px; height: 20px; color: var(--pmuted); opacity: .6; flex: none }

  if (t !== undefined) curTarget = t;
  document.querySelectorAll('.target').forEach(e => e.classList.remove('target'));
  if (!curTarget || targetOff) return;
  const q = n => document.querySelector(`#stage [data-t="${CSS.escape(n)}"]`);
  // If the thing to tap is out of sight (a stray tap closed a page), point at the way back to it.
  const first = LESSONS[ci] && LESSONS[ci].steps[si] && LESSONS[ci].steps[si].target;
  const el = q(curTarget) || (first && first !== curTarget ? q(first) : null) || (S.sheet ? q('create-cancel') : S.page ? q('trip-back') : S.screen !== 'home' ? q('tab-home') : null);
  if (el) {
    el.classList.add('target');
    const sc = el.closest('.scr');
    if (sc) { const r = el.getBoundingClientRect(), s = sc.getBoundingClientRect(), k = document.getElementById('stagebox').clientWidth / 390;
      if (r.top < s.top + 40 * k || r.bottom > s.bottom - 110 * k) sc.scrollTop += (r.top - s.top - 120 * k) / k; }
  }
}
function renderRail() {
  const total = LESSONS.reduce((n, l) => n + l.steps.length, 0);
  const before = LESSONS.slice(0, ci).reduce((n, l) => n + l.steps.length, 0) + si;
  document.getElementById('rail').innerHTML = `<div class="brand"><span class="logo">${icon('trips')}</span><div><h1>Packing Tour</h1><small>Learn the app in about 12 minutes</small></div></div>
    ${LESSONS.map((l, i) => `<button class="chap ${i === ci ? 'cur' : ''} ${doneChapters.has(i) ? 'done' : ''}" data-ch="${i}">${icon(l.icon)}<span>${l.title}</span><span class="n">${doneChapters.has(i) ? '\u2713' : l.steps.length + ' steps'}</span></button>`).join('')}
    <button class="chap ${ci === LESSONS.length ? 'cur' : ''}" data-ch="${LESSONS.length}">${icon('phone')}<span>Now on your iPhone</span></button>
    <div class="bar"><i style="width:${Math.round(100 * Math.min(before, total) / total)}%"></i></div>
    <p class="railnote">Practice copy, nothing changes in your real app. Based on AMS Packing 0.126.</p>`;
}
document.getElementById('rail').addEventListener('click', e => { const b = e.target.closest('[data-ch]'); if (b) goChapter(+b.dataset.ch); });

function goChapter(i) {
  ci = i; si = 0; clearTimers(); S = START();
  const L = LESSONS[i]; if (L && L.setup) L.setup();
  renderStep();
}
function renderStep() {
  renderRail();
  const coach = document.getElementById('coach'), fin = document.getElementById('finish');
  if (ci >= LESSONS.length) { renderFinish(); coach.hidden = true; return; }
  coach.hidden = false; fin.hidden = true;
  const L = LESSONS[ci], st = L.steps[si];
  solved = st.kind === 'look'; targetOff = false;
  if (st.setup) st.setup();
  S.toast = ''; clearTimeout(act.ut);
  const kindName = { look: 'Look', try: 'Try it', check: 'Check' }[st.kind];
  coach.innerHTML = `<div class="eyebrow">${icon(L.icon)} ${esc(L.title)} <span class="kind">\u00B7 ${kindName} \u00B7 step ${si + 1} of ${L.steps.length}</span></div>
    <div><h2>${esc(st.head)}</h2><p>${esc(st.text)}</p>${st.hint ? `<p style="color:var(--muted);font-size:13px">${esc(st.hint)}</p>` : ''}</div>
    <div class="btns">${ci + si > 0 ? '<button class="btn ghost" id="back">Back</button>' : ''}<button class="btn main-b" id="next" ${solved ? '' : 'disabled'}>${si === L.steps.length - 1 ? 'Finish chapter' : 'Next'}</button></div>
    ${st.kind === 'check' ? `<div class="answers">${st.answers.map((a, i) => `<button class="ans" data-a="${i}">${esc(a)}</button>`).join('')}</div>` : ''}
    <p class="feedback" id="fb"></p>`;
  curTarget = st.target || null;
  renderStage();
  if (st.kind === 'check') coach.querySelectorAll('.ans').forEach(b => b.onclick = () => {
    const fb = document.getElementById('fb');
    if (+b.dataset.a === st.right) { coach.querySelectorAll('.ans').forEach(x => x.disabled = true); b.classList.add('right'); succeed(st.ok); }
    else { b.classList.add('wrong'); fb.textContent = 'Not quite. Try another answer.'; fb.className = 'feedback no'; }
  });
  document.getElementById('next').onclick = next;
  const bk = document.getElementById('back'); if (bk) bk.onclick = back;
}
function next() {
  const L = LESSONS[ci];
  if (si < L.steps.length - 1) { si++; renderStep(); return; }
  doneChapters.add(ci); store.set('packingtour-done', JSON.stringify([...doneChapters]));
  goChapter(ci + 1);
}
function back() { if (si > 0) { si--; renderStep(); } else if (ci > 0) { goChapter(ci - 1); } }

function renderFinish() {
  const fin = document.getElementById('finish'); fin.hidden = false;
  clearTimers(); S = START(); curTarget = null; renderStage();
  const items = ['Open Packing on your iPhone. Find the Next trip countdown, Grab and go, and the Library rows on Home.',
    'Press "New trip", type a name, tap two days in the calendar, tick one template and press "Create trip". Delete it again at the foot of its page (Delete trip asks first).',
    'On a trip, tap a few lines, press a heading\u2019s round button, then press "Undo".',
    'Open the Bags row, tap a bag and type what your luggage scale says, then tap "Bags" in the Stations row and tick each bag as it comes out.',
    'Under Papers, press "Add trip papers" and add a PDF or a photo of a booking.',
    'After a real trip: open "Unpack" on the trip page (or from the quiet line on Home) and tick each thing back into its room.',
    'Open Settings with the nut and check that iCloud sync says "In sync". Then open "How it works".'];
  let ticks = JSON.parse(store.get('packingtour-real') || '[]');
  fin.innerHTML = `<h3>Now on your iPhone</h3>${items.map((t, i) => `<label><input type="checkbox" id="real-${i}" ${ticks.includes(i) ? 'checked' : ''}><span>${esc(t)}</span></label>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn main-b" id="again">Start the tour again</button></div>`;
  fin.querySelectorAll('input').forEach((c, i) => c.onchange = () => { ticks = ticks.filter(x => x !== i); if (c.checked) ticks.push(i); store.set('packingtour-real', JSON.stringify(ticks)); });
  document.getElementById('again').onclick = () => goChapter(0);
}

/* Fit the 390 x 760 pretend iPhone into its box */
function fit() { const box = document.getElementById('stagebox'); document.getElementById('stage').style.transform = `scale(${box.clientWidth / 390})`; }
new ResizeObserver(fit).observe(document.getElementById('stagebox'));
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet && ['create', 'grab', 'tpl', 'stations', 'onsite', 'unpack'].includes(S.sheet)) { S.sheet = null; renderStage(); return; }
  if (e.key === 'Enter' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') { const n = document.getElementById('next'); if (n && !n.disabled && document.activeElement !== n) n.click(); }
});
goChapter(0); fit();
</script>
