# A probe branch only (never merged): the iPhone UI tests in tools/probe-tests.txt — every
# test that, in 0.96's full run, tapped with the keyboard up, swiped a list down, dragged a
# grip or swiped the whole app — on GitHub's own iPhone, in three parts side by side.
# Like the Tests workflow's iPhone job, with one retry of what failed (at most 5).
name: iPhone probe
on:
  push:
    branches: ['probe/**']
jobs:
  iphone:
    name: iPhone probe (${{ matrix.part }} of 3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator the runner actually has
        run: |
          UDID=$(xcodebuild -showdestinations -project AMSPacking.xcodeproj -scheme AMSPacking 2>/dev/null | python3 -c '
          import re, sys
          best = None
          for line in sys.stdin:
              m = re.search(r"platform:iOS Simulator,.*?id:([0-9A-F-]{36}), OS:([0-9.]+), name:iPhone (\d+) \}", line)
              if m:
                  key = (int(m.group(3)), [int(x) for x in m.group(2).split(".")])
                  if best is None or key > best[0]:
                      best = (key, m.group(1), "iPhone " + m.group(3) + ", iOS " + m.group(2))
          if best: print(best[1], best[2])
          ')
          NAME=$(echo "$UDID" | cut -d" " -f2-)
          UDID=$(echo "$UDID" | cut -d" " -f1)
          if [ -z "$UDID" ]; then echo "::error::no iPhone simulator on this runner"; exit 1; fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator: $NAME"

      - name: Wake the simulator before the first test
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: The chosen iPhone tests, part ${{ matrix.part }}
        id: ui
        run: |
          set +e     # a red first run goes on to its retry
          # Longest first, each into the part with the least so far (as tools/ui-shard.py).
          ONLY=$(python3 - ${{ matrix.part }} <<'EOF'
          import json, sys
          part = int(sys.argv[1])
          names = [l.strip() for l in open("tools/probe-tests.txt") if l.strip()]
          times = json.load(open("tools/ui-test-times.json"))
          cost = lambda n: times.get(n, {}).get("iphone", 40.0)
          parts = [[0.0, []] for _ in range(3)]
          for n in sorted(names, key=cost, reverse=True):
              p = min(parts, key=lambda x: x[0]); p[0] += cost(n); p[1].append(n)
          print(" ".join("-only-testing:AMSPackingUITests/AMSPackingUITests/" + n for n in sorted(parts[part - 1][1])))
          EOF
          )
          echo "$ONLY" | tr ' ' '\n' | sed 's|.*/||' > part.txt
          echo "$(wc -l < part.txt) tests in this part"
          OPTS=(-project AMSPacking.xcodeproj -scheme AMSPacking -destination "platform=iOS Simulator,id=$SIM_UDID"
                -derivedDataPath build -collect-test-diagnostics never -test-timeouts-enabled YES
                -maximum-test-execution-time-allowance 480 CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="")
          R=Probe-iPhone-${{ matrix.part }}
          xcodebuild test $ONLY -resultBundlePath $R.xcresult "${OPTS[@]}"
          status=$?
          [ $status -eq 0 ] && { echo "### part ${{ matrix.part }}: green on the first run" >> $GITHUB_STEP_SUMMARY; exit 0; }
          RETRY=$(python3 tools/ui-failed.py $R.xcresult) || exit $status
          echo "retried=1" >> $GITHUB_OUTPUT
          { echo "### part ${{ matrix.part }}: failed the first time"; echo; echo "$RETRY" | sed 's|.*/|- |'; } >> $GITHUB_STEP_SUMMARY
          xcodebuild test-without-building $RETRY -resultBundlePath $R-retry.xcresult "${OPTS[@]}"

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Probe-iPhone-${{ matrix.part }}
          path: Probe-iPhone-*.xcresult
