name: TestFlight

# Builds AMS Packing for the iPhone AND the Mac and sends both to TestFlight,
# so a new version reaches his devices without touching the Mac. Started by
# hand from the Actions tab.
#
# Needs four repository secrets, made once in App Store Connect:
#   ASC_KEY_ID     the key's ID, ten characters
#   ASC_ISSUER_ID  the issuer ID shown above the key list
#   ASC_KEY_P8     the whole contents of the AuthKey_XXXXXXXXXX.p8 file
#   ASC_TEAM_ID    the ten-character Team ID from App Store Connect > Membership
#
# And the name of the TestFlight tester group, as the repository VARIABLE
# TESTER_GROUP (Settings > Secrets and variables > Actions > Variables) — or as a
# secret of that name, which also keeps it out of the run's log. Not written in
# this file: the repository is public (the spec pass, 5 Oct 2026).
#
# 🚨 The key must have the ADMIN role. An App Manager key uploads fine but
# cannot do the cloud signing below, and fails with "Cloud signing permission
# error". (Learned on AMS PARA, and once more on AMS Coffee.)
#
# The app record for com.schabbauer.AMSPacking must exist in App Store Connect
# with BOTH platforms (iOS and macOS) before the first run — that is a browser
# step for the account owner; an API key cannot create it.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: What is new in this build — testers see it as "What to Test"
        required: false
        default: ""

jobs:
  # A red suite must never reach a device.
  tests:
    name: The suite has to pass first
    uses: ./.github/workflows/tests.yml

  upload:
    name: Build and send to TestFlight
    needs: tests
    runs-on: macos-26
    # 120 since 0.67: archive and upload take ~20 minutes, and the release step now
    # waits up to 90 for Apple to show both builds.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30     # enough history to find the last What's new change

      # His rule (4 Oct 2026): every nit documented. A release whose What's new
      # changed without docs/spec changing in the same commit is not built.
      - name: The specification moved with What's new
        run: tools/check-spec.sh

      - name: Use the newest Xcode on the runner
        run: |
          # Apple refuses uploads built with an older SDK, so always take the
          # highest Xcode the image has.
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Check the secrets are there
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
          TESTER_GROUP: ${{ secrets.TESTER_GROUP || vars.TESTER_GROUP }}
        run: |
          missing=""
          [ -z "$KEY_ID" ] && missing="$missing ASC_KEY_ID"
          [ -z "$ISSUER" ] && missing="$missing ASC_ISSUER_ID"
          [ -z "$KEY" ] && missing="$missing ASC_KEY_P8"
          [ -z "$TEAM_ID" ] && missing="$missing ASC_TEAM_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # Checked here too, before anything is built: without the group's name a
          # build would go up and reach nobody.
          if [ -z "$TESTER_GROUP" ]; then
            echo "::error::The repository variable TESTER_GROUP is not set — add it under Settings > Secrets and variables > Actions > Variables, with the TestFlight tester group's name."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Number this build
        run: |
          # The version in project.yml is the single source; the run number keeps
          # every upload unique within it (Apple refuses a repeated build number).
          APP_VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\([^"]*\)".*/\1/p' project.yml | head -1)
          [ -n "$APP_VERSION" ] || { echo "::error::no MARKETING_VERSION in project.yml"; exit 1; }
          BUILD="${{ github.run_number }}"
          echo "App version: $APP_VERSION, build $BUILD"
          echo "APP_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "BUILD=$BUILD" >> $GITHUB_ENV

      - name: Entitlements for a build that ships
        run: |
          # The iCloud entitlements, but for Production: the store, the push
          # environment. (A development build's sandbox exception for the
          # CloudKit daemon stays in until a shipped build proves it is not
          # needed — see docs/store.md.)
          sed -e 's|<string>Development</string>|<string>Production</string>|' \
              -e 's|<string>development</string>|<string>production</string>|' \
              App/Config/AMSPacking-iCloud.entitlements > App/Config/AMSPacking-Ship.entitlements
          grep -c "Production" App/Config/AMSPacking-Ship.entitlements
          # The iPhone names the push entitlement "aps-environment"; the Mac names it
          # "com.apple.developer.aps-environment". With only the Mac's name the iPhone
          # never got iCloud's "something changed" notice and fetched only when the
          # app was opened again (his test A.4, 2026-09-28).
          sed -e 's|<key>com.apple.developer.aps-environment</key>|<key>aps-environment</key>|' \
              App/Config/AMSPacking-Ship.entitlements > App/Config/AMSPacking-Ship-iOS.entitlements
          grep -c "<key>aps-environment</key>" App/Config/AMSPacking-Ship-iOS.entitlements
          # Apple Health fills in the trip review (0.70, docs/spec/07 part 7): READ only,
          # and the iPhone's alone — the Mac has no Apple Health, so its file stays without.
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.healthkit bool true" \
              -c "Add :com.apple.developer.healthkit.access array" App/Config/AMSPacking-Ship-iOS.entitlements
          grep -c "com.apple.developer.healthkit" App/Config/AMSPacking-Ship-iOS.entitlements

      - name: Write the App Store Connect key
        env:
          KEY: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          # A browser textarea can normalise newlines to CRLF on submit; strip
          # them, and drop blank lines.
          printf '%s\n' "$KEY" | tr -d '\r' | awk 'NF' > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          F="$HOME/private_keys/AuthKey_$KEY_ID.p8"
          head -1 "$F" | grep -q "BEGIN PRIVATE KEY" || { echo "::error::ASC_KEY_P8 does not start with -----BEGIN PRIVATE KEY-----"; exit 1; }
          tail -1 "$F" | grep -q "END PRIVATE KEY" || { echo "::error::ASC_KEY_P8 does not end with -----END PRIVATE KEY-----"; exit 1; }
          openssl pkey -in "$F" -noout || { echo "::error::ASC_KEY_P8 is not a valid private key"; exit 1; }

      - name: Archive for the iPhone and for the Mac
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          mkdir -p build
          for platform in iOS macOS; do
            echo "=== $platform"
            ENTITLEMENTS=App/Config/AMSPacking-Ship.entitlements
            if [ "$platform" = iOS ]; then ENTITLEMENTS=App/Config/AMSPacking-Ship-iOS.entitlements; fi
            # -allowProvisioningUpdates lets Apple register the bundle identifier
            # and its iCloud container on the first run.
            xcodebuild archive \
              -project AMSPacking.xcodeproj \
              -scheme AMSPacking \
              -destination "generic/platform=$platform" \
              -archivePath "$PWD/build/AMSPacking-$platform.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER" \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_STYLE=Automatic \
              CODE_SIGN_ENTITLEMENTS="$ENTITLEMENTS" \
              PACKING_USES_ICLOUD=YES \
              MARKETING_VERSION="$APP_VERSION" \
              CURRENT_PROJECT_VERSION="$BUILD" \
              2>&1 | tee "build/archive-$platform.log" | grep -E "error:|\*\* ARCHIVE" || true
            grep -q "\*\* ARCHIVE SUCCEEDED \*\*" "build/archive-$platform.log"
          done

      # Never send an iPhone build that cannot read Apple Health. Without the HealthKit
      # entitlement the review's "From Apple Health" block would only ever say "not
      # allowed" — and nothing else would show that anything was missing. Workout Sync
      # shipped seven such builds (23 Sep 2026) before it checked this; the owner allowed
      # (7 Oct 2026) that a version GitHub cannot sign with it is archived and uploaded
      # from his Mac instead.
      - name: The iPhone archive must carry the HealthKit entitlement
        run: |
          APP="build/AMSPacking-iOS.xcarchive/Products/Applications/AMSPacking.app"
          codesign -d --entitlements - "$APP" > build/entitlements-iOS.txt 2>&1 || true
          cat build/entitlements-iOS.txt
          if ! grep -q "com.apple.developer.healthkit" build/entitlements-iOS.txt; then
            echo "::error::the archived iPhone app has no HealthKit entitlement (com.apple.developer.healthkit) — it would ship unable to read Apple Health. Archive and upload this version from the Mac."
            exit 1
          fi
          echo "HealthKit entitlement present."

      - name: Send both to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.ASC_TEAM_ID }}
        run: |
          set -o pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          /usr/libexec/PlistBuddy -c "Add :teamID string $TEAM_ID" build/ExportOptions.plist
          for platform in iOS macOS; do
            echo "=== $platform"
            xcodebuild -exportArchive \
              -archivePath "$PWD/build/AMSPacking-$platform.xcarchive" \
              -exportPath "$PWD/build/export-$platform" \
              -exportOptionsPlist build/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$HOME/private_keys/AuthKey_$KEY_ID.p8" \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER" \
              2>&1 | tee "build/export-$platform.log" | grep -E "error:|Upload|EXPORT" || true
            grep -q "\*\* EXPORT SUCCEEDED \*\*" "build/export-$platform.log"
          done

      - name: Release them to the tester group
        # The group's name comes from the repository (see the top of this file); the
        # notes become the builds' "What to Test" — through the environment, never
        # pasted into the script (0.59's quotes broke the shell). Testers never saw
        # them before: they went only into the summary below (the spec pass, 5 Oct 2026).
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TESTER_GROUP: ${{ secrets.TESTER_GROUP || vars.TESTER_GROUP }}
          WHAT_TO_TEST: ${{ github.event.inputs.notes }}
        run: |
          if [ -z "$TESTER_GROUP" ]; then
            echo "::error::The repository variable TESTER_GROUP is not set — add it under Settings > Secrets and variables > Actions > Variables, with the TestFlight tester group's name."
            exit 1
          fi
          # An upload alone reaches no device: the build has to be released to
          # a group, and an internal group does not take new builds by itself.
          ASC_KEY_PATH="$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
          BUILD_VERSION="$BUILD" \
          APP_BUNDLE_ID=com.schabbauer.AMSPacking \
          python3 tools/release-to-testers.py

      - name: Say what happened
        if: success()
        # The notes come in through the environment, never pasted into the script:
        # 0.59's notes held quotes ("Both have one") and the pasted text broke the
        # shell — after the build had gone out, so a good release showed as failed.
        env:
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          echo "### Sent to TestFlight — iPhone and Mac" >> $GITHUB_STEP_SUMMARY
          echo "AMS Packing $APP_VERSION, build $BUILD." >> $GITHUB_STEP_SUMMARY
          echo "Apple processes it for a few minutes, then it appears in TestFlight on both devices." >> $GITHUB_STEP_SUMMARY
          if [ -n "$NOTES" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            printf 'What is new: %s\n' "$NOTES" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Keep the logs when something fails
        if: always()
        # Keeping the logs must never fail a release that went out: in 0.64's run both
        # builds were sent and released, and this step alone timed out talking to GitHub.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: testflight-logs
          path: build/*.log
          if-no-files-found: ignore
