name: Tests

# Every push runs the suite — the model's own tests, then the UI tests on the
# iPhone AND on the Mac, because he uses this app on both. A red run means the
# build is not fit to install.
#
# FIVE jobs, the five Mac machines a free account gets at once (0.67): three iPhone
# groups and two Mac groups. The model's tests ride in Mac group 1 and the parity
# check in Mac group 2 — as jobs of their own they made seven, and on 0.66's
# release one Mac group waited 40 minutes for a free machine.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:      # the TestFlight workflow runs this suite first

jobs:
  iphone:
    name: UI tests — iPhone (${{ matrix.group }} of 3)
    # Three groups side by side, about 47 minutes of tests each (tools/ui-shard.py): one
    # after another they took 148 minutes in 0.63's release (his ask, 6 Oct 2026). Three
    # iPhone and two Mac groups are the five Mac machines GitHub gives a free account at once.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    # macos-26 with the newest Xcode, like the Mac job and like the build that ships:
    # on macos-15 the tests ran under Xcode 16.4 on an iOS 18 simulator — a pairing no
    # TestFlight build ever has — and the template search's ✕ failed there twice
    # (0.60, 0.61; 5 Oct 2026) while it passes on iOS 26/27 and on the Mac.
    runs-on: macos-26
    # 30 was outgrown on 2026-09-26 (0.25): an 11-minute build plus 48 tests —
    # cancelled at test 41 of 48 with nothing wrong. 55 was nearly outgrown on
    # 2026-10-02 (0.46: 67 tests, ~50 minutes). Room to grow again.
    # 120: at 108 UI tests (0.58, 4 Oct 2026) the iPhone job passed every one and was
    # cancelled at 80 minutes while the quick model tests were still finishing.
    # 180 while the suite ran as one job; a group now needs about an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Show what we are building with
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator the runner actually has
        run: |
          # Naming one device breaks when GitHub rotates the runner image. Take
          # the highest numbered iPhone, so it is both present and predictable.
          LINE=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone [0-9]" | sort -V | tail -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator:$(echo "$LINE" | sed -E 's/ *\(.*//')"

      - name: Wake the simulator before the first test
        # 0.46 (2026-10-02): a cold simulator cost the FIRST test 95 seconds
        # before it could even start, and slow steps after — 336 s against the
        # 300 s a test may take, so a test that passes was counted red.
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: UI tests on the iPhone simulator
        run: |
          xcodebuild test $(python3 tools/ui-shard.py iphone ${{ matrix.group }} 3) \
            -project AMSPacking.xcodeproj \
            -scheme AMSPacking \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults-iPhone-${{ matrix.group }}.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-iPhone-${{ matrix.group }}
          path: TestResults-iPhone-${{ matrix.group }}.xcresult

  mac:
    name: UI tests — Mac (${{ matrix.group }} of 2)
    # Two groups side by side, about 51 minutes of tests each (tools/ui-shard.py); one
    # after another, 101 minutes in 0.63's release.
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    # macos-26, not macos-15: his Mac runs macOS 26, and on the runner's older
    # SwiftUI a click on a pill "succeeded" and selected nothing, three runs in
    # a row, while the same test is green here every time.
    runs-on: macos-26
    # 120, the same room as the iPhone job: the Mac runs the same 110-odd UI tests and,
    # since 0.62, both bundles of model tests as well (the iPhone job outgrew 80 minutes
    # at 108 UI tests, 0.58, 4 Oct 2026). 180 while it ran as one job; a group needs about an hour.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Group 1 also runs the model's own tests (until 0.67 the "core" job).
      - name: Model tests
        if: matrix.group == 1
        run: cd Core && swift test
      # The "What to Test" requests the TestFlight release makes, checked without the
      # network — a release is the wrong moment to find one malformed (5 Oct 2026).
      - name: The release script's own check
        if: matrix.group == 1
        run: python3 tools/release-to-testers.py --self-check
      # The UI tests run in groups side by side: every test in exactly one group.
      - name: Every UI test is in one group
        if: matrix.group == 1
        run: python3 tools/ui-shard.py --check

      # Group 2 also checks parity (until 0.67 the "parity" job): the Swift model and
      # the web app's model answer the same 200-odd questions about an INVENTED
      # backup, and every answer must be identical. (On his real data the same check
      # runs on his Mac — that file never leaves it.) The web app's model is taken
      # from its own repository, so a change THERE that the Swift model has not
      # followed turns this red.
      - name: The web app's model
        if: matrix.group == 2
        uses: actions/checkout@v4
        with:
          repository: marsch124/AMS-Packing
          path: web-app
      - name: Node for the web app's model
        if: matrix.group == 2
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Parity with the web app's model
        if: matrix.group == 2
        run: PARITY_MODEL="$PWD/web-app/js/model.js" tools/parity/run.sh --invented

      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: UI tests on the Mac
        run: |
          # Signed "to run locally" (-): a Mac app cannot be driven unsigned,
          # and the runner has no developer certificate.
          xcodebuild test $(python3 tools/ui-shard.py mac ${{ matrix.group }} 2) \
            -project AMSPacking.xcodeproj \
            -scheme AMSPacking \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -resultBundlePath TestResults-Mac-${{ matrix.group }}.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-Mac-${{ matrix.group }}
          path: TestResults-Mac-${{ matrix.group }}.xcresult
