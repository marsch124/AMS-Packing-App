name: Tests

# Every push runs the suite — the model's own tests, then the UI tests on the
# iPhone AND on the Mac, because he uses this app on both. A red run means the
# build is not fit to install.
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:      # the TestFlight workflow runs this suite first

jobs:
  core:
    name: The model (Core package)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Nothing under 15 pt
        # His floor (F073, 5 Oct 2026): he reads the app without his glasses, so a
        # word drawn under 15 points turns this red, naming file and line. A drawn
        # mark may stay smaller when its line says "// not text: <what it is>".
        run: tools/check-type-floor.sh
      - name: Model tests
        run: cd Core && swift test

  parity:
    # The Swift model and the web app's model answer the same 200-odd questions
    # about an INVENTED backup; every answer must be identical. (On his real data
    # the same check runs on his Mac — that file never leaves it.) The web app's
    # model is taken from its own repository, so a change THERE that the Swift
    # model has not followed turns this red.
    name: Parity with the web app's model
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: marsch124/AMS-Packing
          path: web-app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Both models, answer by answer
        run: PARITY_MODEL="$PWD/web-app/js/model.js" tools/parity/run.sh --invented

  iphone:
    name: UI tests — iPhone
    # macos-26 with the newest Xcode, like the Mac job and like the build that ships:
    # on macos-15 the tests ran under Xcode 16.4 on an iOS 18 simulator — a pairing no
    # TestFlight build ever has — and the template search's ✕ failed there twice
    # (0.60, 0.61; 5 Oct 2026) while it passes on iOS 26/27 and on the Mac.
    runs-on: macos-26
    # 30 was outgrown on 2026-09-26 (0.25): an 11-minute build plus 48 tests —
    # cancelled at test 41 of 48 with nothing wrong. 55 was nearly outgrown on
    # 2026-10-02 (0.46: 67 tests, ~50 minutes). Room to grow again.
    # 120: at 108 UI tests (0.58, 4 Oct 2026) the iPhone job passed every one and was
    # cancelled at 80 minutes while the quick model tests were still finishing.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version

      - name: Show what we are building with
        run: |
          xcodebuild -version
          xcrun simctl list devices available | grep -E "iPhone" | head

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Pick a simulator the runner actually has
        run: |
          # Naming one device breaks when GitHub rotates the runner image. Take
          # the highest numbered iPhone, so it is both present and predictable.
          LINE=$(xcrun simctl list devices available \
            | grep -E "^ +iPhone [0-9]" | sort -V | tail -1)
          if [ -z "$LINE" ]; then
            LINE=$(xcrun simctl list devices available | grep -E "^ +iPhone" | tail -1)
          fi
          UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$UDID" ]; then
            echo "::error::no iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV
          echo "Using simulator:$(echo "$LINE" | sed -E 's/ *\(.*//')"

      - name: Wake the simulator before the first test
        # 0.46 (2026-10-02): a cold simulator cost the FIRST test 95 seconds
        # before it could even start, and slow steps after — 336 s against the
        # 300 s a test may take, so a test that passes was counted red.
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

      - name: UI tests on the iPhone simulator
        run: |
          xcodebuild test \
            -project AMSPacking.xcodeproj \
            -scheme AMSPacking \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath TestResults-iPhone.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 480 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-iPhone
          path: TestResults-iPhone.xcresult

  mac:
    name: UI tests — Mac
    # macos-26, not macos-15: his Mac runs macOS 26, and on the runner's older
    # SwiftUI a click on a pill "succeeded" and selected nothing, three runs in
    # a row, while the same test is green here every time.
    runs-on: macos-26
    # 120: at 108 UI tests (0.58, 4 Oct 2026) the iPhone job passed every one and was
    # cancelled at 80 minutes while the quick model tests were still finishing.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: UI tests on the Mac
        run: |
          # Signed "to run locally" (-): a Mac app cannot be driven unsigned,
          # and the runner has no developer certificate.
          xcodebuild test \
            -project AMSPacking.xcodeproj \
            -scheme AMSPacking \
            -destination "platform=macOS" \
            -derivedDataPath build \
            -resultBundlePath TestResults-Mac.xcresult \
            -collect-test-diagnostics never \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 300 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Keep the results when it goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-Mac
          path: TestResults-Mac.xcresult
