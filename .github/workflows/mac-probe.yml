# A short run of chosen Mac UI tests, on a probe branch only — so a Mac-only
# failure can be checked in minutes without taking over the owner's screen.
name: Mac probe
on:
  push:
    branches: ['probe/**']
jobs:
  mac:
    name: Mac probe
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Chosen UI tests on the Mac
        run: |
          T=AMSPackingUITests/AMSPackingUITests
          xcodebuild test -project AMSPacking.xcodeproj -scheme AMSPacking -destination "platform=macOS" \
            -derivedDataPath build -resultBundlePath Probe-Mac.xcresult -collect-test-diagnostics never \
            -only-testing:$T/testABagWithNothingWeighedIsOnTheTrip \
            -only-testing:$T/testAChangeToAThingReachesATripStillAhead \
            -only-testing:$T/testAChoiceIsRenamedAndMovedAndItsThingsFollow \
            -only-testing:$T/testAPlaceIsSetFromTheTrip \
            -only-testing:$T/testARestoreSwipedAwaySaysNothingWasReplaced \
            -only-testing:$T/testARowOfAListHasItsOwnAnswers \
            -only-testing:$T/testASectionTypedInARowIsMadeOnlyOnSave \
            -only-testing:$T/testAThingIsOfferedOnlyHisOwnBags \
            -only-testing:$T/testAThingOpensFromTheWayHomeAndComesBack \
            -only-testing:$T/testAThingsOwnDetailsAndItsListsAreChanged \
            -only-testing:$T/testAThingsPageMakesANewSectionOnSave \
            -only-testing:$T/testAThingsPageReadsInHisOrderAndKeptAtHomeIsChosen \
            -only-testing:$T/testAThingsPageSetsItsSectionOnATemplate \
            -only-testing:$T/testAThingsPageTakesDecimalsAPlaceNoBagAndCare \
            -only-testing:$T/testATripSortedBySectionReadsUnderItsSections \
            -only-testing:$T/testEscapeLeavesHomeAndTemplatesWindowsWithoutSaving \
            -only-testing:$T/testEveryAddButtonIsReadyAndSaysWhatIsMissing \
            -only-testing:$T/testEveryRowShowsTheTickTheTripHolds \
            -only-testing:$T/testHisOwnListsAreAddedAndProtectedWhileInUse \
            -only-testing:$T/testSetPlaceAndTheReviewSayWhatIsMissingAndNoTemplateIsChosen \
            -only-testing:$T/testTheEditorsLeadWithTheirHeadings \
            -only-testing:$T/testThePickOneListsAreDropDownsThatChooseAndKeep \
            -only-testing:$T/testTheTableOffersHisOwnBagsAndOwnersAndAConditionReachesToBuy \
            -only-testing:$T/testTheTripSaysSortingBesideItsDropDown \
            -only-testing:$T/testWhoseItIsOffersEachOwnerOnce \
            -only-testing:$T/testWhoseItIsSaysWhereNamesComeFromWhenNobodyIsNamed \
            -only-testing:$T/testWhatsNewStartsWithThisVersion \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" PROVISIONING_PROFILE_SPECIFIER=""
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Probe-Mac
          path: Probe-Mac.xcresult
